replicaCount: 2

image:
  repository: beasteats
  tag: "1.0.0"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

ingress:
  enabled: false

database:
  persistence:
    enabled: true
    existingClaim: beasteats-app-data
    mountPath: /app/instance

secret:
  existingSecret: beasteats-app-secret
  secretKeyName: SECRET_KEY
