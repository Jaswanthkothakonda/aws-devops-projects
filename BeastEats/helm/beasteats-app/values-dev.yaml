replicaCount: 1

image:
  repository: beasteats
  tag: "1.0.0"
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: 150m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

ingress:
  enabled: false

database:
  persistence:
    enabled: true
    existingClaim: beasteats-app-data
    mountPath: /app/instance

secret:
  existingSecret: beasteats-app-secret
  secretKeyName: SECRET_KEY