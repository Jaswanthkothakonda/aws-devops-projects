---
- name: Check Docker service status
  ansible.builtin.command: systemctl is-active docker
  register: docker_service_status
  changed_when: false
  failed_when: false

- name: Display Docker service status
  ansible.builtin.debug:
    msg: "Docker service status: {{ docker_service_status.stdout | default('unknown') }}"

- name: Check installed Docker version
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false
  failed_when: false

- name: Display Docker version
  ansible.builtin.debug:
    msg: "Installed Docker version: {{ docker_version.stdout | default('unavailable') }}"
